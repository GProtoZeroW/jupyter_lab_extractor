[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jupyter-lab-extractor"
version = "0.1.0"
description = "A Jupyter cell magic that extracts cell contents to Python files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "ipython",
    "ipynbname",
]

[tool.setuptools]
packages = ["jupyter_lab_extractor"]

[project.urls]
Repository = "https://github.com/GProtoZeroW/jupyter_lab_extractor"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "ipytest>=0.13.0",
    "jupytext>=1.14.0",
    "loguru>=0.7.0",
    "notebook>=6.0.0",
    "jupyterlab>=3.0.0",
]
dev = [
    "jupyter-lab-extractor[test]",
    "build>=0.10.0",
    "twine>=4.0.0",
]