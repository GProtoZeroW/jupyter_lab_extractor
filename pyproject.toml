[build-system]
# 77 is the real floor, not 61: `license` below is a PEP 639 SPDX expression,
# and setuptools rejects it as an invalid project.license before that version.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jupyter-lab-extractor"
version = "0.2.0.dev0"
description = "A Jupyter cell magic that extracts cell contents to Python files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "GProtoZeroW", email = "GProtoZeroW@users.noreply.github.com" },
]
keywords = [
    "jupyter",
    "jupyterlab",
    "notebook",
    "ipython",
    "cell-magic",
    "extract",
    "literate-programming",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: IPython",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
dependencies = [
    # Tested against 8.18 (Python 3.9) and 9.x (Python 3.13). The floor is the
    # first release supporting Python 3.9, which is this package's own floor.
    "ipython>=7.20",
    "ipynbname",
]

[tool.setuptools]
packages = ["jupyter_lab_extractor"]

[project.scripts]
jlx = "jupyter_lab_extractor.cli:main"

[project.urls]
Homepage = "https://github.com/GProtoZeroW/jupyter_lab_extractor"
Repository = "https://github.com/GProtoZeroW/jupyter_lab_extractor"
Issues = "https://github.com/GProtoZeroW/jupyter_lab_extractor/issues"
Changelog = "https://github.com/GProtoZeroW/jupyter_lab_extractor/blob/main/CHANGELOG.md"

# `cli` stays an extra: this package is consumed as a git dependency by kicad-db,
# serdeslab, physmathrepr and micropython-i2c, and `jlx run` is real published
# surface a consumer may want. Test tooling and JupyterLab are not -- nobody
# should be able to install those as a feature -- so they moved to PEP 735
# groups below, which are never published and, unlike extras, are installed by a
# bare `uv sync`, so .venv gets a kernel without anyone remembering a flag.
[project.optional-dependencies]
cli = [
    "jupytext>=1.14.0",
    "nbclient>=0.7.0",
    "nbformat>=5.0",
    "ipykernel>=6.0",
]

# No consumer referenced jupyter-lab-extractor[test]; all four depend on the
# bare name. The self-reference below is the extras mechanism used correctly:
# tests/test_cli_*.py exercise the CLI, so they need what `cli` installs.
[dependency-groups]
test = [
    "jupyter-lab-extractor[cli]",
    "pytest>=7.0.0",
    "ipytest>=0.13.0",
    # Exercised by the rich-output test: `jlx run` must persist a rendered
    # figure and DataFrame back into the .ipynb, which needs real libraries
    # producing real image/png and text/html payloads.
    "matplotlib>=3.5",
    "pandas>=1.3",
]

# The magic is exercised from inside a live notebook, so the notebook stack is
# part of developing it, not an optional add-on.
notebook = [
    "jupyterlab>=3.0.0",
    "notebook>=6.0.0",
]

dev = [
    { include-group = "test" },
    { include-group = "notebook" },
    "build>=0.10.0",
    "twine>=4.0.0",
]

[tool.uv]
# dev pulls in notebook, so a bare `uv sync` yields a launchable env.
default-groups = ["dev"]
